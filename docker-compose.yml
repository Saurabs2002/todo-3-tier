services:

  # =========================
  # FRONTEND
  # =========================
  frontend:
    build:
      context: ./frontend

    container_name: todo-frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - todo-network


  # =========================
  # BACKEND
  # =========================
  backend:
    build:
      context: ./backend

    container_name: todo-backend

    ports:
      - "3000:3000"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: todo_db

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - todo-network


  # =========================
  # POSTGRESQL DATABASE
  # =========================
  postgres:
    image: postgres:16

    container_name: todo-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d todo_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - todo-network


# =========================
# VOLUME
# =========================
volumes:

  postgres-data:


# =========================
# NETWORK
# =========================
networks:

  todo-network:
    driver: bridge
