services:

 
  # FRONTEND

  frontend:
    image: ${DOCKER_USERNAME}/${FRONTEND_IMAGE}:latest
    container_name: todo-frontend

    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - todo-network




  # POSTGRES DATABASE

  postgres:
    image: postgres:16-alpine
    container_name: todo-postgres

    restart: always

    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d todo_db

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - todo-network



  
  # BACKEND API
 
  backend:
    image: ${DOCKER_USERNAME}/${BACKEND_IMAGE}:latest
    container_name: todo-backend

    restart: always

    ports:
      - "3000:3000"


    environment:

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: todo_db
      DB_USER: postgres
      DB_PASSWORD: postgres


    depends_on:

      postgres:
        condition: service_healthy


    networks:
      - todo-network


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor

    restart: always

    ports:
      - "8080:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

    privileged: true

    networks:
      - todo-network

 
  # PROMETHEUS MONITORING

  prometheus:

    image: prom/prometheus:latest

    container_name: prometheus


    restart: always


    ports:

      - "9090:9090"


    volumes:

      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml


    depends_on:

      - backend


    networks:

      - todo-network





  
  # GRAFANA DASHBOARD
  
  grafana:

    image: grafana/grafana:latest

    container_name: grafana


    restart: always


    ports:

      - "3001:3000"


    volumes:

      - grafana-storage:/var/lib/grafana


    depends_on:

      - prometheus


    networks:

      - todo-network






# NETWORK CONFIGURATION


networks:

  todo-network:

    driver: bridge






# VOLUMES CONFIGURATION


volumes:

  postgres-data:

  grafana-storage:
