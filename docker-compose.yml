services:

  # =====================================================
  # POSTGRESQL DATABASE
  # =====================================================
  postgres:
    image: postgres:16
    container_name: todo-postgres

    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d todo_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - todo-network


  # =====================================================
  # BACKEND
  # =====================================================
  backend:
    build:
      context: ./backend

    container_name: todo-backend

    ports:
      - "3000:3000"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: todo_db

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - todo-network


  # =====================================================
  # FRONTEND
  # =====================================================
  frontend:
    build:
      context: ./frontend

    container_name: todo-frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - todo-network


  # =====================================================
  # CADVISOR
  # =====================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: todo-cadvisor

    ports:
      - "8081:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - todo-network


  # =====================================================
  # PROMETHEUS
  # =====================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: todo-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      - cadvisor

    networks:
      - todo-network


  # =====================================================
  # GRAFANA
  # =====================================================
  grafana:
    image: grafana/grafana:latest
    container_name: todo-grafana

    ports:
      - "3001:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - todo-network


# =========================================================
# NETWORKS
# =========================================================
networks:
  todo-network:
    driver: bridge


# =========================================================
# VOLUMES
# =========================================================
volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
