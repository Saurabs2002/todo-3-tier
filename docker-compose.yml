version: "3.8"

services:

  # =====================================================
  # POSTGRES DATABASE
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: todo-postgres

    restart: always

    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - todo-network


  # =====================================================
  # BACKEND
  # =====================================================
  backend:
    image: ${DOCKER_USERNAME}/${BACKEND_IMAGE}:latest
    container_name: todo-backend

    restart: always

    ports:
      - "3000:3000"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: todo
      DB_USER: postgres
      DB_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - todo-network


  # =====================================================
  # FRONTEND
  # =====================================================
  frontend:
    image: ${DOCKER_USERNAME}/${FRONTEND_IMAGE}:latest
    container_name: todo-frontend

    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - todo-network


  # =====================================================
  # PROMETHEUS
  # =====================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: todo-prometheus

    restart: always

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

    networks:
      - todo-network


  # =====================================================
  # GRAFANA
  # =====================================================
  grafana:
    image: grafana/grafana:latest
    container_name: todo-grafana

    restart: always

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - todo-network



# =====================================================
# NETWORKS
# =====================================================
networks:

  todo-network:
    driver: bridge



# =====================================================
# VOLUMES
# =====================================================
volumes:

  postgres-data:

  prometheus-data:

  grafana-data:
