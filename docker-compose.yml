services:

  postgres:
    image: postgres:16
    container_name: todo-postgres

    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - todo-network


  backend:
    image: ${DOCKER_USERNAME}/${BACKEND_IMAGE}:latest
    container_name: todo-backend

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: todo_db
      DB_USER: postgres
      DB_PASSWORD: postgres

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    ports:
      - "3000:3000"

    networks:
      - todo-network


  frontend:
    image: ${DOCKER_USERNAME}/${FRONTEND_IMAGE}:latest
    container_name: todo-frontend

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"

    networks:
      - todo-network


networks:
  todo-network:
    driver: bridge


volumes:
  postgres-data:
